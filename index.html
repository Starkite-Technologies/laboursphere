<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabourSphere</title>
<style>
:root{
  --ink:#0F2A3D; --teal:#0E7C7B; --teal-d:#0A5F5E; --teal-l:#E3F2F1; --amber:#E8A33D; --amber-l:#FCF3E1;
  --red:#C9503A; --red-l:#FBEAE6; --green:#2B8F62; --green-l:#E4F4EC;
  --bg:#F5F7F9; --card:#fff; --line:#E2E8EE; --text:#1B2B38; --muted:#5E7183;
  --r:14px; --shadow:0 1px 2px rgba(15,42,61,.06),0 4px 14px rgba(15,42,61,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.2rem)} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0 0 .8em} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;padding:0 10px 18px;color:#fff;text-decoration:none}
.logo b{width:32px;height:32px;border-radius:9px;background:var(--teal);display:grid;place-items:center;font-size:.95rem}
.side a.n{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#C6D3DD;text-decoration:none;font-weight:500}
.side a.n:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.n.on{background:var(--teal);color:#fff}
.side .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#7F95A6;padding:16px 12px 6px}
.side .foot{margin-top:auto;font-size:.78rem;color:#7F95A6;padding:12px}
main{padding:32px clamp(16px,4vw,48px) 60px;max-width:1080px;width:100%}
.top,.tabs{display:none}

@media(max-width:820px){
  .app{display:block}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;background:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:5}
  .top .logo{padding:0;font-size:1.05rem}
  .top .r{display:flex;gap:6px}
  .top .r a{color:#fff;text-decoration:none;font-size:.82rem;font-weight:600;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.1)}
  .top .r a.on{background:var(--teal)}
  main{padding:20px 16px 110px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
  .tabs a.on{color:var(--teal)}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none;min-height:46px}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.9rem}
.btn.block{width:100%}
.muted{color:var(--muted)} .small{font-size:.86rem}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--teal-l);color:var(--teal-d);text-transform:uppercase;letter-spacing:.04em}
.pill.low{background:var(--green-l);color:var(--green)} .pill.med{background:var(--amber-l);color:#9A6410} .pill.high{background:var(--red-l);color:var(--red)} .pill.grey{background:#EDF1F4;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--ink),#16405A);color:#fff;border-radius:20px;padding:clamp(24px,5vw,44px);margin-bottom:24px}
.hero h1{color:#fff} .hero p{color:#C9D8E3;max-width:540px}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:12px;padding:4px;margin:10px 0 20px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#fff;padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
.pick{display:flex;gap:14px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.pick:hover{border-color:var(--teal)}
.pick .ic{width:42px;height:42px;border-radius:11px;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;flex:none}
.pick b{display:block;color:var(--ink)} .pick span{color:var(--muted);font-size:.9rem}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:8px 0 28px}
.steps .num{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .25s}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.yn button{padding:20px;font-size:1.1rem;font-weight:700;border-radius:var(--r);border:2px solid var(--line);background:#fff;cursor:pointer}
.yn button:hover{border-color:var(--teal);background:var(--teal-l)}
ul.tick{list-style:none;padding:0;margin:0 0 6px} ul.tick li{padding:7px 0 7px 28px;position:relative}
ul.tick li:before{content:"";position:absolute;left:4px;top:13px;width:11px;height:6px;border-left:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);transform:rotate(-45deg)}
.note{background:var(--amber-l);border-radius:10px;padding:12px 14px;font-size:.86rem;color:#6B4A12;margin-top:18px}
.next{border:2px solid var(--teal);background:var(--teal-l)} .next.high{border-color:var(--red);background:var(--red-l)}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px;color:var(--ink)}
input,select,textarea{width:100%;padding:12px;border:1px solid #CBD5DE;border-radius:10px;background:#fff;min-height:46px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(14,124,123,.3);outline-offset:1px;border-color:var(--teal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} @media(max-width:560px){.two{grid-template-columns:1fr}}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{padding:10px 16px;border-radius:10px;border:1px solid #CBD5DE;background:#fff;cursor:pointer;font-weight:600}
.slots button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.slots button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
details.g{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow)}
details.g summary{cursor:pointer;padding:16px 18px;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g div{padding:0 18px 16px}
.prod{display:flex;flex-direction:column;gap:8px} .prod .price{font-size:1.25rem;font-weight:700;color:var(--ink);margin-top:auto;padding-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.kpi b{display:block;font-size:1.7rem;color:var(--ink);line-height:1.1} .kpi span{font-size:.82rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.hb{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:9px 0;font-size:.9rem}
.hb i{display:block;height:14px;border-radius:7px;background:var(--teal);min-width:4px}
@media(max-width:560px){.hb{grid-template-columns:110px 1fr 28px}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.paper{background:#fff;border:1px solid var(--line);padding:clamp(20px,5vw,44px);border-radius:6px;font-family:Georgia,"Times New Roman",serif;line-height:1.6;box-shadow:var(--shadow)}
.paper h2{font-family:inherit;text-align:center;font-size:1.15rem;letter-spacing:.03em}
.modal{position:fixed;inset:0;background:rgba(15,42,61,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:440px;width:100%;max-height:92vh;overflow:auto}
.radio{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-weight:500;cursor:pointer}
.radio input{width:auto;min-height:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.demo-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div>
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n?'N$ '+Number(n).toLocaleString('en-US'):'Free';
const fmtD=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ago=n=>Date.now()-n*864e5;
const IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 check:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 guides:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 19v2H6"/>',
 shop:'<path d="M6 8h12l1 13H5z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
 book:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 mine:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
 owner:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
 flow:'<rect x="3" y="3" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/><path d="M6.5 9v5a2 2 0 0 0 2 2H14"/>',
 deck:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

/* ---------- demo content (sample only - to be verified by LabourSphere) ---------- */
const TOPICS=[
 {id:'discipline',aud:'employer',title:'Employee misconduct',sub:'Warnings, hearings and fair process',prod:'p1',
  qs:[['Could the outcome be dismissal?',2,0],['Has the employee already been suspended or told to leave?',2,0],['Do you have written evidence (statements, records)?',0,1]],
  tips:['Put the allegation to the employee in writing, in plain language.','Give reasonable time to prepare and allow a representative.','Hold a hearing where the employee can respond before any decision is made.','Keep a record of every step. Fair reason and fair procedure both matter.']},
 {id:'performance',aud:'employer',title:'Poor work performance',sub:'Managing and documenting performance',prod:'p4',
  qs:[['Has the employee been told in writing what standard is expected?',0,1],['Have they been given time and support to improve?',0,1],['Are you considering dismissal right now?',2,0]],
  tips:['Explain the required standard clearly and in writing.','Agree an improvement plan with a realistic time frame.','Offer training or support, and record review meetings.','Dismissal for performance should be a last step after a fair process.']},
 {id:'retrench',aud:'employer',title:'Retrenchment or restructuring',sub:'Reducing staff for operational reasons',prod:'p5',
  qs:[['Will anyone lose their job for operational reasons?',2,0],['Do you plan to act within the next four weeks?',2,0],['Have you started consulting the affected employees?',0,1]],
  tips:['Written notice to the Labour Commissioner and to employees or their union is required, at least four weeks before dismissals.','Consult in good faith on alternatives and on selection criteria.','Severance pay is generally at least one week’s pay per year of continuous service.','Retrenchment is high-risk. Get professional advice before you act.']},
 {id:'contracts',aud:'employer',title:'Contracts and policies',sub:'Getting the basics in place',prod:'p6',
  qs:[['Do all employees have written terms of employment?',0,1],['Do you have a disciplinary and grievance policy?',0,1],['Are you currently facing a dispute or a labour inspection?',3,0]],
  tips:['Give every employee written terms: job, pay, hours, leave and notice.','Adopt a simple disciplinary code and grievance procedure.','Keep employment records up to date and stored safely.','A yearly compliance check prevents most avoidable disputes.']},
 {id:'dismissed',aud:'employee',title:'I was dismissed',sub:'Or I think I am about to be',prod:'f1',
  qs:[['Have you already been dismissed?',2,0],['Were you given a hearing or a chance to respond?',0,1],['Did it happen more than five months ago?',2,0]],
  tips:['A dismissal needs a valid and fair reason and a fair procedure.','Keep your contract, payslips, letters and messages together.','Dismissal disputes are generally referred to the Labour Commissioner within six months, so do not wait.','Write down what happened, with dates, while it is fresh.']},
 {id:'pay',aud:'employee',title:'Pay, leave or overtime',sub:'Money or leave I believe I am owed',prod:'f1',
  qs:[['Is money still owed to you right now?',1,0],['Have you raised it in writing with your employer?',0,1],['Has your employment already ended?',1,0]],
  tips:['Check your contract and payslips against what you were paid.','Raise the issue in writing and keep a copy.','On termination you are generally paid outstanding wages and accrued leave.','If it is not resolved, the Office of the Labour Commissioner can assist.']},
 {id:'grievance',aud:'employee',title:'Unfair treatment at work',sub:'Grievances, harassment, discrimination',prod:'f1',
  qs:[['Does it involve harassment, discrimination or your safety?',3,0],['Have you reported it through your workplace procedure?',0,1],['Are you worried about being victimised for speaking up?',1,0]],
  tips:['Use your employer’s grievance procedure and put the complaint in writing.','Record dates, what was said or done, and any witnesses.','You should not be punished for raising a genuine complaint.','Serious matters such as harassment deserve professional support.']}
];
const GUIDES=[
 ['Annual leave: how much?','Leave','Under the Labour Act 11 of 2007, employees are generally entitled to at least four consecutive weeks of paid annual leave in each annual leave cycle. For a five-day worker that is 20 working days.'],
 ['Sick leave basics','Leave','Sick leave works on a three-year cycle. A five-day worker generally gets at least 30 working days in the cycle, and a six-day worker 36. An employer may ask for a medical certificate for longer absences.'],
 ['Maternity leave','Leave','An employee with at least six months’ continuous service is generally entitled to at least 12 weeks of maternity leave, taken before and after the birth.'],
 ['Working hours and overtime','Pay','Ordinary hours are generally capped at 45 hours a week. Overtime needs agreement, is limited, and is paid at a higher rate. Different rules can apply to some jobs such as security work.'],
 ['Notice of termination','Ending work','Minimum notice generally depends on length of service: one day in the first four weeks, one week after that up to a year, and one month after more than a year. Notice should be in writing.'],
 ['What makes a dismissal fair?','Ending work','Two things are needed: a valid and fair reason (such as misconduct, incapacity or operational needs) and a fair procedure, which normally means the employee hears the case and gets a real chance to respond.'],
 ['Severance pay','Ending work','An employee with at least 12 months’ continuous service who is dismissed (other than for misconduct or poor performance), or who retires at 65, is generally owed severance of at least one week’s pay per year of service.'],
 ['Referring a dispute','Disputes','Disputes can be referred to the Office of the Labour Commissioner for conciliation and arbitration. Dismissal disputes generally must be referred within six months, and most other disputes within one year.'],
 ['Running a disciplinary hearing','Discipline','Give written notice of the allegation, allow time to prepare, let the employee be represented and respond, use an impartial chairperson, and confirm the outcome and any right of appeal in writing.'],
 ['Handling a grievance','Discipline','Acknowledge the complaint, look into it promptly and impartially, hear both sides, and give a written outcome. A short, written grievance procedure makes this far easier.']
];
const PRODUCTS=[
 {id:'f1',name:'Employee Rights Quick Guide',price:0,tag:'Guide',desc:'Plain-language summary of core workplace rights and where to get help.',kind:'list',
  items:['Your right to written terms of employment','Leave: annual, sick, maternity and compassionate','Fair reason and fair procedure before dismissal','How to raise a grievance in writing','How and when to refer a dispute','Documents to keep: contract, payslips, letters']},
 {id:'p1',name:'Disciplinary Hearing Toolkit',price:450,tag:'Toolkit',desc:'Create a notice to attend a hearing in minutes, with a step-by-step process.',kind:'hearing'},
 {id:'p4',name:'Warning Letter Templates',price:150,tag:'Template',desc:'Verbal, written and final written warnings, ready to fill in.',kind:'warning'},
 {id:'p3',name:'Employment Contract Template',price:300,tag:'Template',desc:'A clear contract of employment covering the essential terms.',kind:'contract'},
 {id:'p6',name:'SME Labour Compliance Checklist',price:250,tag:'Checklist',desc:'Check your business against the basics every employer should have in place.',kind:'list',
  items:['Written terms of employment for every employee','Disciplinary code and grievance procedure adopted','Leave records kept for each employee','Hours of work and overtime records kept','Payslips issued with every payment','Social security registration and contributions up to date','Health and safety responsibilities assigned','Employment records stored securely for the required period']},
 {id:'p5',name:'Retrenchment Guide & Checklist',price:600,tag:'Guide',desc:'The stages of a fair retrenchment process, with a checklist for each stage.',kind:'list',
  items:['Confirm and document the operational reason','Give written notice to the Labour Commissioner and employees or union (at least four weeks)','Disclose relevant information','Consult in good faith on alternatives','Agree fair and objective selection criteria','Calculate notice, leave and severance pay','Issue written termination letters','Keep a full record of the process']}
];
const SERVICES=[
 {id:'s0',name:'Discovery call (15 min)',price:0},
 {id:'s1',name:'Consultation (30 min)',price:750},
 {id:'s2',name:'Consultation (60 min)',price:1400},
 {id:'s3',name:'Labour audit scoping session',price:2500}
];
const SLOTS=['09:00','10:30','13:00','14:30','16:00'];
const P=id=>PRODUCTS.find(p=>p.id===id), T=id=>TOPICS.find(t=>t.id===id), SV=id=>SERVICES.find(s=>s.id===id);

/* ---------- state (saved on this device only) ---------- */
const KEY='laboursphere_demo_v1';
function seed(){return{aud:'employer',
 leads:[{t:'discipline',risk:'med',at:ago(6)},{t:'dismissed',risk:'high',at:ago(5),done:true},{t:'contracts',risk:'low',at:ago(4)},{t:'retrench',risk:'high',at:ago(2)},{t:'pay',risk:'low',at:ago(1)},{t:'performance',risk:'med',at:ago(1)}],
 orders:[{id:'o1',p:'p6',name:'Sample: Oshana Hardware CC',at:ago(4),sample:true},{id:'o2',p:'p1',name:'Sample: Coastal Logistics',at:ago(3),sample:true}],
 bookings:[{id:'b1',s:'s2',date:iso(ago(-2)),time:'10:30',name:'Sample: T. Nangolo',phone:'',note:'Retrenchment planning',at:ago(2),sample:true}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.leads)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let view='home',chk={},gen=null,gq='',bk={s:'s1',date:'',time:''};

/* ---------- navigation ---------- */
const NAV=[['home','Home'],['check','Issue Checker'],['guides','Guides'],['shop','Products'],['book','Book'],['mine','My Items'],['owner','Owner View']];
function nav(){
 $('#side').innerHTML=`<a class="logo" href="#home"><b>LS</b>LabourSphere</a>`+
  NAV.map(([k,l],i)=>(i===5?'<div class="lbl">Your account</div>':i===6?'<div class="lbl">Business</div>':'')+`<a class="n ${view===k?'on':''}" href="#${k}">${ic(k)}${l}</a>`).join('')+
  `<div class="lbl">Presentation</div><a class="n" href="workflow.html">${ic('flow')}Workflow Chart</a><a class="n" href="pitch-deck.html">${ic('deck')}Pitch Deck</a>
  <div class="foot">Offline demo. No login.<br>Data stays on this device.</div>`;
 $('#top').innerHTML=`<a class="logo" href="#home"><b>LS</b>LabourSphere</a><div class="r"><a class="${view==='mine'?'on':''}" href="#mine">My Items</a><a class="${view==='owner'?'on':''}" href="#owner">Owner</a></div>`;
 $('#tabs').innerHTML=NAV.slice(0,5).map(([k,l])=>`<a class="${view===k?'on':''}" href="#${k}">${ic(k)}${l.replace('Issue ','')}</a>`).join('');
}
function show(h){view=NAV.some(n=>n[0]===h)?h:'home';if(view!=='mine')gen=null;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+view)}catch(e){}}
function go(){show(location.hash.slice(1)||'home')}
window.addEventListener('hashchange',go);

/* ---------- views ---------- */
const V={};
const disclaimer='<div class="note"><b>Demo content.</b> General information only, not legal advice. All wording is sample text to be reviewed by a LabourSphere professional before launch.</div>';

V.home=()=>`
<section class="hero">
 <h1>Workplace problem?<br>Get clear next steps.</h1>
 <p>Simple labour guidance for Namibian businesses and employees. Answer three questions and we point you to the right guide, tool or professional.</p>
 <div class="seg" role="group" aria-label="I am">
  <button data-a="aud" data-v="employer" class="${S.aud==='employer'?'on':''}">I'm an employer</button>
  <button data-a="aud" data-v="employee" class="${S.aud==='employee'?'on':''}">I'm an employee</button>
 </div><br>
 <a class="btn" href="#check" style="background:var(--amber);color:var(--ink)">Start the Issue Checker</a>
</section>
<h2>How it works</h2>
<div class="steps">
 <div class="card"><div class="num">1</div><h3>Tell us the issue</h3><p class="muted small">Pick a topic and answer three yes or no questions.</p></div>
 <div class="card"><div class="num">2</div><h3>Get guidance</h3><p class="muted small">See plain-language steps and how serious the matter is.</p></div>
 <div class="card"><div class="num">3</div><h3>Take the next step</h3><p class="muted small">Read a guide, use a template, or book a professional.</p></div>
</div>
<h2>Explore</h2>
<div class="grid">
 <a class="pick" href="#guides" style="text-decoration:none"><div class="ic">${ic('guides')}</div><div><b>Free guides</b><span>Leave, pay, dismissal and disputes explained simply.</span></div></a>
 <a class="pick" href="#shop" style="text-decoration:none"><div class="ic">${ic('shop')}</div><div><b>Templates and toolkits</b><span>Ready-to-use documents you fill in yourself.</span></div></a>
 <a class="pick" href="#book" style="text-decoration:none"><div class="ic">${ic('book')}</div><div><b>Book a consultation</b><span>Speak to a labour professional when it matters.</span></div></a>
</div>
<div class="demo-links" style="margin-top:26px"><a class="btn ghost sm" href="workflow.html">${ic('flow')}Workflow Chart</a><a class="btn ghost sm" href="pitch-deck.html">${ic('deck')}Pitch Deck</a></div>`;

V.check=()=>{
 if(!chk.t){
  const list=TOPICS.filter(t=>t.aud===S.aud);
  return `<div class="head"><div><h1>Issue Checker</h1><p class="muted">What best describes your situation?</p></div>
   <div class="seg" style="background:#E2E8EE;margin:0"><button data-a="aud" data-v="employer" style="color:var(--ink)" class="${S.aud==='employer'?'on':''}">Employer</button><button data-a="aud" data-v="employee" style="color:var(--ink)" class="${S.aud==='employee'?'on':''}">Employee</button></div></div>
   <div class="grid">${list.map(t=>`<button class="pick" data-a="topic" data-v="${t.id}"><div class="ic">${ic('check')}</div><div><b>${t.title}</b><span>${t.sub}</span></div></button>`).join('')}</div>`;
 }
 const t=T(chk.t);
 if(chk.step<t.qs.length){
  return `<p class="muted small">${t.title} &middot; Question ${chk.step+1} of ${t.qs.length}</p>
   <div class="bar"><i style="width:${(chk.step)/t.qs.length*100}%"></i></div>
   <div class="card"><h2>${t.qs[chk.step][0]}</h2>
    <div class="yn"><button data-a="ans" data-v="1">Yes</button><button data-a="ans" data-v="0">No</button></div>
    <button class="btn ghost sm" data-a="back">Back</button></div>`;
 }
 const r=chk.risk,lab={low:'Low risk',med:'Medium risk',high:'High risk'}[r],p=P(t.prod);
 const next= r==='high'
  ?`<div class="card next high"><h3>This needs a professional</h3><p>Your answers suggest a sensitive or high-risk matter. We have flagged it for human review. Book a consultation so a labour professional can assess it properly.</p><a class="btn" href="#book">Book a consultation</a></div>`
  : r==='med'
  ?`<div class="card next"><h3>Recommended: ${p.name}</h3><p>${p.desc}</p><button class="btn" data-a="buy" data-v="${p.id}">${p.price?'Get it for '+money(p.price):'Get it free'}</button> <a class="btn ghost" href="#book">Or talk to someone</a></div>`
  :`<div class="card next"><h3>You can likely handle this yourself</h3><p>Follow the steps above and read our free guides. If things change, come back and check again.</p><a class="btn" href="#guides">Read the guides</a> ${p.price?`<button class="btn ghost" data-a="buy" data-v="${p.id}">${p.name}</button>`:''}</div>`;
 return `<div class="head"><div><span class="pill ${r}">${lab}</span><h1 style="margin-top:10px">${t.title}</h1></div><button class="btn ghost sm" data-a="restart">Start again</button></div>
  <div class="card" style="margin-bottom:16px"><h3>General guidance</h3><ul class="tick">${t.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>${next}${disclaimer}`;
};

V.guides=()=>{
 const q=gq.toLowerCase(),list=GUIDES.filter(g=>!q||(g[0]+g[1]+g[2]).toLowerCase().includes(q));
 return `<h1>Guides</h1><p class="muted">Short, plain-language answers to common workplace questions.</p>
  <input id="gq" type="search" placeholder="Search, e.g. leave, notice, dismissal" value="${esc(gq)}" aria-label="Search guides" style="margin-bottom:16px">
  <div id="glist">${list.map(g=>`<details class="g"><summary>${g[0]}<span class="pill grey">${g[1]}</span></summary><div>${g[2]}</div></details>`).join('')||'<p class="muted">No guides match your search.</p>'}</div>
  <div class="card" style="margin-top:16px"><b>Not sure which applies to you?</b><p class="muted small">The Issue Checker asks three questions and points you to the right place.</p><a class="btn sm" href="#check">Open Issue Checker</a></div>${disclaimer}`;
};

const owned=id=>S.orders.find(o=>o.p===id&&!o.sample);
V.shop=()=>`<h1>Products</h1><p class="muted">Practical tools you can use straight away. Buy once, use as often as you need.</p>
 <div class="grid">${PRODUCTS.map(p=>`<div class="card prod"><span class="pill" style="align-self:flex-start">${p.tag}</span><h3>${p.name}</h3><p class="muted small">${p.desc}</p>
  <div class="price">${money(p.price)}</div>
  ${owned(p.id)?`<button class="btn ghost block" data-a="open" data-v="${p.id}">Open</button>`:`<button class="btn block" data-a="buy" data-v="${p.id}">${p.price?'Buy':'Get free'}</button>`}</div>`).join('')}</div>`;

V.book=()=>{
 const taken=S.bookings.filter(b=>b.date===bk.date).map(b=>b.time);
 return `<h1>Book a consultation</h1><p class="muted">Choose a service and a time. A labour professional will meet you online or by phone.</p>
 <form class="card" data-f="book">
  <label for="bs">Service</label><select id="bs" data-c="svc">${SERVICES.map(s=>`<option value="${s.id}" ${bk.s===s.id?'selected':''}>${s.name} &ndash; ${money(s.price)}</option>`).join('')}</select>
  <label for="bd">Date</label><input id="bd" type="date" data-c="date" min="${iso(Date.now())}" value="${bk.date}" required>
  <label>Time</label><div class="slots">${SLOTS.map(s=>`<button type="button" data-a="slot" data-v="${s}" class="${bk.time===s?'on':''}" ${!bk.date||taken.includes(s)?'disabled':''}>${s}</button>`).join('')}</div>
  ${bk.date?'':'<p class="muted small" style="margin-top:8px">Pick a date to see available times.</p>'}
  <div class="two"><div><label for="bn">Your name</label><input id="bn" name="name" required autocomplete="name"></div>
  <div><label for="bp">Phone or email</label><input id="bp" name="phone" required></div></div>
  <label for="bt">What is it about? (optional)</label><textarea id="bt" name="note" rows="3"></textarea>
  <button class="btn block" style="margin-top:18px">Confirm booking &middot; ${money(SV(bk.s).price)}</button>
  <p class="muted small" style="margin:10px 0 0;text-align:center">Demo only. No payment is taken.</p>
 </form>`;
};

V.mine=()=>{
 if(gen)return genView();
 const o=S.orders.filter(x=>!x.sample),b=S.bookings.filter(x=>!x.sample);
 return `<h1>My Items</h1><p class="muted">Everything you have bought or booked on this device.</p>
 <div class="card" style="margin-bottom:16px"><h3>My products</h3>${o.length?o.map(x=>`<div class="row"><div><b>${P(x.p).name}</b><div class="muted small">${fmtD(x.at)} &middot; ${money(P(x.p).price)}</div></div><button class="btn sm" data-a="open" data-v="${x.p}">Open</button></div>`).join(''):`<p class="muted">Nothing yet.</p><a class="btn ghost sm" href="#shop">Browse products</a>`}</div>
 <div class="card"><h3>My bookings</h3>${b.length?b.map(x=>`<div class="row"><div><b>${SV(x.s).name}</b><div class="muted small">${fmtD(x.date)} at ${x.time}</div></div><button class="btn ghost sm" data-a="cancel" data-v="${x.id}">Cancel</button></div>`).join(''):`<p class="muted">No bookings yet.</p><a class="btn ghost sm" href="#book">Book a consultation</a>`}</div>`;
};

/* ---------- document generator ---------- */
const F={
 hearing:[['employer','Employer / company name'],['employee','Employee name'],['job','Job title'],['date','Hearing date','date'],['time','Hearing time','time'],['venue','Venue'],['chair','Chairperson'],['charge','Allegation(s)','area']],
 warning:[['employer','Employer / company name'],['employee','Employee name'],['level','Type of warning','sel',['Verbal warning','Written warning','Final written warning']],['months','Valid for (months)','number'],['reason','Reason for the warning','area'],['improve','Improvement required','area']],
 contract:[['employer','Employer / company name'],['employee','Employee name'],['job','Job title'],['start','Start date','date'],['pay','Monthly salary (N$)','number'],['hours','Ordinary hours per week','number'],['place','Place of work']]
};
let gd={};
const g=(k,d)=>esc(gd[k])||`<span style="color:#9AA9B5">[${d}]</span>`;
const sig='<p style="margin-top:36px">_______________________<br>For the employer &nbsp;&nbsp; Date: __________</p><p>_______________________<br>Employee (received) &nbsp;&nbsp; Date: __________</p>';
const DOC={
 hearing:()=>`<h2>NOTICE TO ATTEND A DISCIPLINARY HEARING</h2><p><b>To:</b> ${g('employee','employee')} (${g('job','job title')})<br><b>From:</b> ${g('employer','employer')}<br><b>Date:</b> ${fmtD(Date.now())}</p>
  <p>You are required to attend a disciplinary hearing as follows:</p><p><b>Date:</b> ${gd.date?fmtD(gd.date):g('date','date')}<br><b>Time:</b> ${g('time','time')}<br><b>Venue:</b> ${g('venue','venue')}<br><b>Chairperson:</b> ${g('chair','chairperson')}</p>
  <p><b>Allegation(s):</b><br>${g('charge','describe the allegation')}</p>
  <p><b>Your rights.</b> You may prepare for the hearing, be represented by a fellow employee or trade union representative, state your case, call witnesses, question the employer's witnesses, and request an interpreter.</p>
  <p>If you do not attend without good reason, the hearing may proceed in your absence.</p>${sig}`,
 warning:()=>`<h2>${(esc(gd.level)||'WRITTEN WARNING').toUpperCase()}</h2><p><b>To:</b> ${g('employee','employee')}<br><b>From:</b> ${g('employer','employer')}<br><b>Date:</b> ${fmtD(Date.now())}</p>
  <p>This letter confirms that you are issued with a ${(esc(gd.level)||'written warning').toLowerCase()} for the following reason:</p><p>${g('reason','reason')}</p>
  <p><b>Improvement required:</b><br>${g('improve','what must change')}</p>
  <p>This warning remains valid for ${g('months','number')} months. Further misconduct or failure to improve during this period may lead to further disciplinary action.</p><p>You may appeal against this warning in terms of the company procedure.</p>${sig}`,
 contract:()=>`<h2>CONTRACT OF EMPLOYMENT</h2><p>Between <b>${g('employer','employer')}</b> ("the employer") and <b>${g('employee','employee')}</b> ("the employee").</p>
  <p><b>1. Position.</b> The employee is employed as ${g('job','job title')}, starting on ${gd.start?fmtD(gd.start):g('start','start date')}.</p>
  <p><b>2. Place of work.</b> ${g('place','place of work')}.</p>
  <p><b>3. Remuneration.</b> A basic salary of N$ ${g('pay','amount')} per month, paid monthly in arrears.</p>
  <p><b>4. Hours of work.</b> ${g('hours','hours')} ordinary hours per week. Overtime is worked by agreement and paid as required by law.</p>
  <p><b>5. Leave.</b> Annual, sick, maternity and compassionate leave are granted in line with the Labour Act 11 of 2007.</p>
  <p><b>6. Termination.</b> Either party may end this contract by giving written notice as required by the Labour Act.</p>
  <p><b>7. Policies.</b> The employee agrees to follow the employer's policies, disciplinary code and grievance procedure.</p>${sig}`
};
function genView(){
 const p=P(gen);let body;
 if(p.kind==='list')body=`<div class="paper" id="paper"><h2>${p.name.toUpperCase()}</h2>${p.items.map(i=>`<p>&#9744;&nbsp; ${i}</p>`).join('')}<p style="font-size:.85em;color:#666;margin-top:28px">LabourSphere sample document. General information only.</p></div>`;
 else body=`<div class="card" style="margin-bottom:16px"><h3>Fill in the details</h3><div class="two">${F[p.kind].map(([k,l,ty,op])=>`<div ${ty==='area'?'style="grid-column:1/-1"':''}><label for="f_${k}">${l}</label>${
   ty==='area'?`<textarea id="f_${k}" data-g="${k}" rows="3">${esc(gd[k])}</textarea>`:
   ty==='sel'?`<select id="f_${k}" data-g="${k}">${op.map(o=>`<option ${gd[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:
   `<input id="f_${k}" data-g="${k}" type="${ty||'text'}" value="${esc(gd[k])}">`}</div>`).join('')}</div></div>
   <h3>Preview</h3><div class="paper" id="paper">${DOC[p.kind]()}</div>`;
 return `<div class="head"><div><a href="#mine" data-a="closegen" class="small">&larr; Back to My Items</a><h1 style="margin-top:6px">${p.name}</h1></div>
  <div style="display:flex;gap:8px"><button class="btn sm" data-a="dl">Download (Word)</button><button class="btn ghost sm" data-a="print">Print</button></div></div>${body}${disclaimer}`;
}

/* ---------- owner dashboard ---------- */
V.owner=()=>{
 const L=S.leads,rev=S.orders.reduce((a,o)=>a+P(o.p).price,0)+S.bookings.reduce((a,b)=>a+SV(b.s).price,0);
 const c=r=>L.filter(l=>l.risk===r).length,mx=Math.max(1,L.length),esc_=L.filter(l=>l.risk==='high');
 const hb=(l,n,col)=>`<div class="hb"><span>${l}</span><i style="width:${n/mx*100}%;background:${col}"></i><b>${n}</b></div>`;
 return `<div class="head"><div><h1>Owner View</h1><p class="muted" style="margin:0">How the business is running, updated automatically.</p></div>
  <div style="display:flex;gap:8px"><button class="btn ghost sm" data-a="reset">Reset demo data</button></div></div>
 <div class="kpis">
  <div class="card kpi"><b>${L.length}</b><span>Enquiries</span></div>
  <div class="card kpi"><b>${S.orders.length}</b><span>Product orders</span></div>
  <div class="card kpi"><b>${S.bookings.length}</b><span>Bookings</span></div>
  <div class="card kpi"><b>${rev?money(rev):'N$ 0'}</b><span>Revenue</span></div>
  <div class="card kpi"><b style="color:var(--red)">${esc_.filter(l=>!l.done).length}</b><span>Awaiting human review</span></div>
 </div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <div class="card"><h3>Where enquiries went</h3>
   ${hb('All enquiries',L.length,'var(--ink)')}${hb('Self-help guide',c('low'),'var(--green)')}${hb('Product offered',c('med'),'var(--amber)')}${hb('Escalated',c('high'),'var(--red)')}
   <p class="muted small" style="margin:12px 0 0">Low and medium matters are handled automatically. High-risk matters always go to a person.</p></div>
  <div class="card"><h3>Human review queue</h3>${esc_.length?esc_.map(l=>`<div class="row"><div><b>${T(l.t).title}</b><div class="muted small">${fmtD(l.at)} &middot; ${T(l.t).aud}</div></div>${l.done?'<span class="pill low">Reviewed</span>':`<button class="btn sm" data-a="review" data-v="${l.at}">Mark reviewed</button>`}</div>`).join(''):'<p class="muted">Nothing waiting.</p>'}</div>
  <div class="card"><h3>Recent orders</h3>${S.orders.length?S.orders.slice().reverse().map(o=>`<div class="row"><div><b>${P(o.p).name}</b><div class="muted small">${esc(o.name)} &middot; ${fmtD(o.at)}</div></div><b>${money(P(o.p).price)}</b></div>`).join(''):'<p class="muted">No orders yet.</p>'}</div>
  <div class="card"><h3>Upcoming bookings</h3>${S.bookings.length?S.bookings.slice().reverse().map(b=>`<div class="row"><div><b>${esc(b.name)}</b><div class="muted small">${SV(b.s).name} &middot; ${fmtD(b.date)} at ${b.time}</div></div><b>${money(SV(b.s).price)}</b></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>
 </div>`;
};

function render(){nav();$('#main').innerHTML=V[view]()}

/* ---------- actions ---------- */
function checkout(id){
 const p=P(id);
 $('#modal').innerHTML=`<div class="modal"><form class="card" data-f="pay" data-v="${id}"><h2>${p.price?'Checkout':'Get your free guide'}</h2>
  <div class="row" style="border:0;padding-top:0"><span>${p.name}</span><b>${money(p.price)}</b></div>
  <label for="cn">Name or business</label><input id="cn" name="name" required>
  ${p.price?`<label>Pay with</label>${['Card','Bank transfer (EFT)','Mobile wallet'].map((m,i)=>`<label class="radio"><input type="radio" name="m" ${i?'':'checked'}>${m}</label>`).join('')}`:''}
  <button class="btn block" style="margin-top:12px">${p.price?'Pay '+money(p.price):'Get it now'}</button>
  <button type="button" class="btn ghost block" style="margin-top:8px" data-a="closem">Cancel</button>
  <p class="muted small" style="text-align:center;margin:10px 0 0">Demo only. No payment is taken.</p></form></div>`;
 $('#cn').focus();
}
const A={
 aud(v){S.aud=v;chk={};save();render()},
 topic(v){chk={t:v,step:0,pts:0,hist:[]};render()},
 ans(v){const t=T(chk.t),q=t.qs[chk.step],add=+v?q[1]:q[2];chk.hist.push(add);chk.pts+=add;chk.step++;
  if(chk.step===t.qs.length){chk.risk=chk.pts>=3?'high':chk.pts>=2?'med':'low';S.leads.push({t:t.id,risk:chk.risk,at:Date.now()});save()}render()},
 back(){if(!chk.step)chk={};else{chk.step--;chk.pts-=chk.hist.pop()}render()},
 restart(){chk={};render()},
 buy(v){owned(v)?A.open(v):checkout(v)},
 open(v){gen=v;gd={};show('mine')},
 closegen(){},
 closem(){$('#modal').innerHTML=''},
 slot(v){bk.time=v;keepForm(render)},
 cancel(v){S.bookings=S.bookings.filter(b=>b.id!==v);save();render();toast('Booking cancelled')},
 review(v){const l=S.leads.find(x=>x.at==v);if(l)l.done=true;save();render()},
 reset(){S=seed();save();render();toast('Demo data reset')},
 print(){window.print()},
 dl(){const p=P(gen),html=`<html><head><meta charset="utf-8"><style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.5}h2{text-align:center}</style></head><body>${$('#paper').innerHTML}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿',html],{type:'application/msword'}));a.download=p.name.replace(/[^a-z0-9]+/gi,'-')+'.doc';document.body.appendChild(a);a.click();a.remove();toast('Document downloaded')}
};
function keepForm(fn){const f=$('form[data-f=book]'),d=f?Object.fromEntries(new FormData(f)):{};fn();const n=$('form[data-f=book]');if(n)for(const k in d)if(n.elements[k])n.elements[k].value=d[k]}

document.addEventListener('click',e=>{const l=e.target.closest('a[href^="#"]');if(l){e.preventDefault();if(l.dataset.a==='closegen')gen=null;show(l.getAttribute('href').slice(1));return}
 const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.tagName==='BUTTON')e.preventDefault();A[b.dataset.a](b.dataset.v)}
 if(e.target.classList.contains('modal'))A.closem()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')A.closem()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;
 if(c==='svc'){bk.s=e.target.value;keepForm(render)}
 if(c==='date'){bk.date=e.target.value;bk.time='';keepForm(render)}});
document.addEventListener('input',e=>{
 if(e.target.id==='gq'){gq=e.target.value;const q=gq.toLowerCase();
  $('#glist').innerHTML=GUIDES.filter(g=>!q||(g[0]+g[1]+g[2]).toLowerCase().includes(q)).map(g=>`<details class="g"><summary>${g[0]}<span class="pill grey">${g[1]}</span></summary><div>${g[2]}</div></details>`).join('')||'<p class="muted">No guides match your search.</p>'}
 const k=e.target.dataset.g;if(k){gd[k]=e.target.value;$('#paper').innerHTML=DOC[P(gen).kind]()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.dataset.f==='pay'){const id=f.dataset.v;S.orders.push({id:'o'+Date.now(),p:id,name:d.name,at:Date.now()});save();A.closem();toast(P(id).price?'Payment successful':'Added to My Items');A.open(id)}
 if(f.dataset.f==='book'){if(!bk.time){toast('Please choose a time');return}
  S.bookings.push({id:'b'+Date.now(),s:bk.s,date:bk.date,time:bk.time,name:d.name,phone:d.phone,note:d.note,at:Date.now()});save();bk={s:'s1',date:'',time:''};show('mine');toast('Booking confirmed')}});
go();
</script>
</body>
